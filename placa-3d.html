<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A placa da Stela em 3D</title>
<meta name="description" content="A placa de circuito da Profa. Maristela (Stela) em 3D: gire com o mouse, o dedo ou as setas e clique nos chips para conhecer cada parte.">
<link rel="icon" href="favicon.ico" sizes="any">
<script src="assets/js/placa.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/estilo.css">
<style>
  /* ============================================================
     A placa em 3D: só HTML e CSS (transform 3D) e um pouco de JavaScript
     para girar com o mouse, o dedo ou as setas do teclado.
     ============================================================ */
  :root {
    --verde-placa: #0f5c3b;
    --verde-lado: #0a3a26;
    --neon: #39ff9e;
    --chip: #111827;
  }

  body {
    background: radial-gradient(ellipse at 50% 40%, #0f2a1e, var(--fundo) 70%);
    color: var(--texto);
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
  }

  .topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .topo a {
    color: var(--ouro-forte);
    text-decoration: none;
    font-weight: 700;
  }

  h1 {
    font-family: var(--f-titulo);
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin: .2rem 0 .3rem;
    text-align: center;
  }

  h1 span {
    color: var(--neon);
    text-shadow: 0 0 12px rgba(57, 255, 158, .5);
  }

  .dica {
    text-align: center;
    color: var(--texto-2);
    margin: 0 1rem;
  }

  /* Palco com perspectiva */
  .palco {
    perspective: 1400px;
    height: min(70vw, 520px);
    display: grid;
    place-items: center;
    touch-action: none;
    cursor: grab;
    user-select: none;
    margin-top: .5rem;
  }

  .palco.arrastando {
    cursor: grabbing;
  }

  .placa {
    --rx: 58deg;
    --rz: -32deg;
    position: relative;
    width: min(72vw, 520px);
    aspect-ratio: 13 / 9;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx)) rotateZ(var(--rz));
    transition: transform .08s linear;
  }

  /* Topo da placa, com os furinhos e o brilho */
  .placa-topo {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background:
      radial-gradient(circle, rgba(57, 255, 158, .18) 1.5px, transparent 2px) 0 0 / 28px 28px,
      linear-gradient(135deg, #12704a, var(--verde-placa));
    box-shadow: 0 0 0 2px rgba(57, 255, 158, .35) inset;
    transform: translateZ(10px);
  }

  /* Bordas da placa (espessura) */
  .placa-lado {
    position: absolute;
    background: var(--verde-lado);
  }

  .placa-lado.frente {
    left: 0;
    right: 0;
    bottom: 0;
    height: 10px;
    transform-origin: bottom;
    transform: rotateX(-90deg);
  }

  .placa-lado.direita {
    top: 0;
    bottom: 0;
    right: 0;
    width: 10px;
    transform-origin: right;
    transform: rotateY(90deg);
  }

  /* Trilhas de cobre, desenhadas num SVG deitado no topo */
  .trilhas {
    position: absolute;
    inset: 0;
    transform: translateZ(11px);
    pointer-events: none;
  }

  .trilhas path {
    fill: none;
    stroke: #d9a441;
    stroke-width: 3;
    stroke-opacity: .75;
    stroke-linecap: round;
  }

  .trilhas .pulso {
    stroke: var(--neon);
    stroke-width: 4;
    stroke-opacity: 1;
    stroke-dasharray: 14 400;
    animation: corre 3s linear infinite;
  }

  @keyframes corre {
    from { stroke-dashoffset: 414; }
    to { stroke-dashoffset: 0; }
  }

  /* Um chip: caixa 3D feita com o topo e quatro lados */
  .chip {
    --alt: 22px;
    position: absolute;
    transform-style: preserve-3d;
    transform: translateZ(10px);
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
  }

  .chip .face {
    position: absolute;
    background: #05070c;
  }

  .chip .topo-chip {
    inset: 0;
    background: var(--chip);
    border: 1.5px solid #2e4a3c;
    border-radius: 4px;
    transform: translateZ(var(--alt));
    display: grid;
    place-items: center;
    font: 700 clamp(.6rem, 1.6vw, .95rem) var(--f-mono);
    color: #e8fff3;
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }

  .chip .lado-f {
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--alt);
    transform-origin: bottom;
    transform: rotateX(-90deg);
    background: #0a0f18;
  }

  .chip .lado-d {
    top: 0;
    bottom: 0;
    right: 0;
    width: var(--alt);
    transform-origin: right;
    transform: rotateY(90deg);
  }

  .chip .lado-t {
    left: 0;
    right: 0;
    top: 0;
    height: var(--alt);
    transform-origin: top;
    transform: rotateX(90deg);
  }

  .chip .lado-e {
    top: 0;
    bottom: 0;
    left: 0;
    width: var(--alt);
    transform-origin: left;
    transform: rotateY(-90deg);
  }

  .chip .led {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f5c542;
    box-shadow: 0 0 8px #f5c542;
    animation: liga 1.8s ease-in-out infinite;
  }

  @keyframes liga {
    50% { opacity: .25; }
  }

  .chip:hover .topo-chip,
  .chip:focus-visible .topo-chip,
  .chip[aria-pressed="true"] .topo-chip {
    border-color: var(--neon);
    box-shadow: 0 0 18px rgba(57, 255, 158, .6);
    color: var(--neon);
  }

  .chip:focus-visible {
    outline: none;
  }

  .chip.central {
    --alt: 34px;
  }

  .chip.central .topo-chip {
    border: 2.5px solid var(--neon);
    color: var(--neon);
    font-size: clamp(.9rem, 2.6vw, 1.5rem);
    font-family: var(--f-titulo);
    font-weight: 800;
  }

  .chip.central .led {
    background: #ff5c7a;
    box-shadow: 0 0 8px #ff5c7a;
  }

  /* Painel com a explicação do chip clicado */
  .painel {
    max-width: 640px;
    margin: 0 auto 2rem;
    padding: 1rem 1.2rem;
    border: 1px solid var(--borda-forte);
    border-radius: 12px;
    background: var(--superficie);
    min-height: 5.5rem;
    margin-inline: 1rem;
  }

  @media (min-width: 680px) {
    .painel {
      margin-inline: auto;
    }
  }

  .painel h2 {
    font-family: var(--f-titulo);
    margin: 0 0 .3rem;
    font-size: 1.15rem;
    color: var(--neon);
  }

  .painel p {
    margin: 0;
  }

  .controles {
    display: flex;
    justify-content: center;
    gap: .6rem;
    flex-wrap: wrap;
    margin: .5rem 1rem 1rem;
  }

  .controles button {
    font: inherit;
    font-size: .9rem;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--borda-forte);
    border-radius: 999px;
    padding: .4rem .9rem;
    cursor: pointer;
  }

  .controles button:hover {
    border-color: var(--ouro);
  }

  /* celular: chips mais baixos, para um não esconder o outro */
  @media (max-width: 600px) {
    .chip { --alt: 10px; }
    .chip.central { --alt: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .trilhas .pulso,
    .chip .led {
      animation: none;
    }
    .placa {
      transition: none;
    }
  }

  .pausado .trilhas .pulso,
  .pausado .chip .led {
    animation: none;
  }
</style>
</head>
<body>
  <div class="topo">
    <a href="./">← Portal da Stela</a>
    <a href="https://github.com/MARISTELAOLIVEIRA">GitHub</a>
  </div>

  <h1>A placa da <span>Stela</span> em 3D</h1>
  <p class="dica">Arraste para girar (ou use as setas do teclado). Clique em um chip para conhecer cada parte.</p>

  <div class="palco" id="palco">
    <div class="placa" id="placa">
      <div class="placa-lado frente"></div>
      <div class="placa-lado direita"></div>
      <div class="placa-topo"></div>
      <svg class="trilhas" id="trilhas" viewBox="0 0 520 360" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <div class="controles">
    <button type="button" id="girar">Girar sozinha</button>
    <button type="button" id="voltar">Voltar ao início</button>
  </div>

  <section class="painel" id="painel" aria-live="polite">
    <h2>U1 · STELA</h2>
    <p>Professora de TI. Ligo hardware, software e gente. Clique nos outros chips para ver o que está ligado a mim.</p>
  </section>

<script>
  /* ============================================================
     Os chips da placa: posição na placa (em uma grade de 520 x 360),
     tamanho e o texto que aparece no painel ao clicar.
     ============================================================ */
  const CHIPS = [
    { id: "STELA", x: 200, y: 130, w: 120, h: 100, central: true,
      titulo: "U1 · STELA",
      texto: "Professora de TI no Senac DF há 12 anos. Entrei pela telecom e nunca achei a porta de saída. Minha mente não tem modo de economia de energia." },
    { id: "Python", x: 40, y: 40, w: 100, h: 64,
      titulo: "R1 · Programação",
      texto: "Python e JavaScript são as minhas favoritas. Também PHP, HTML, CSS, Git e GitHub. Os meus sites de aula rodam Python até dentro do navegador." },
    { id: "Nuvem", x: 380, y: 40, w: 100, h: 64,
      titulo: "R3 · Nuvem",
      texto: "AWS e Azure, com foco em segurança em nuvem. Preparatórios de AWS Cloud Foundations e AZ-900 aos sábados." },
    { id: "IoT", x: 210, y: 30, w: 100, h: 56,
      titulo: "U0 · IoT",
      texto: "Onde hardware, software, conectividade e nuvem se encontram. ESP32 e Arduino são onde tudo o que eu sei vira projeto." },
    { id: "Redes", x: 40, y: 256, w: 100, h: 64,
      titulo: "C1 · Redes",
      texto: "Cisco, CCNA e infraestrutura. No preparatório CCNA a turma treina sub-redes numa maratona com ranking." },
    { id: "IA", x: 380, y: 256, w: 100, h: 64,
      titulo: "C2 · IA e segurança",
      texto: "Machine Learning, Segurança da Informação e IA com consciência: a IA ajuda, mas quem entende e decide é a gente." },
    { id: "Pessoas", x: 210, y: 274, w: 100, h: 56,
      titulo: "Q3 · Pessoas",
      texto: "Inclusão, neurodiversidade e formação de professores. Sou neurodivergente (TEA, AH/SD, TPAC, TDAH e TAG) e falo disso com orgulho." },
    { id: "Sucata", x: 40, y: 150, w: 90, h: 60,
      titulo: "Q1 · Sucata eletrônica",
      texto: "Placas, CIs e componentes que iam para o lixo viram arte. Em breve, no Circuito Verde: reciclando ideias, reprogramando o futuro." },
  ];

  const placa = document.getElementById("placa");
  const palco = document.getElementById("palco");
  const trilhas = document.getElementById("trilhas");
  const painel = document.getElementById("painel");

  // Trilhas: do chip central até o centro de cada chip
  const central = CHIPS.find((c) => c.central);
  const meio = (c) => [c.x + c.w / 2, c.y + c.h / 2];
  let desenho = "";
  CHIPS.filter((c) => !c.central).forEach((c, i) => {
    const [ax, ay] = meio(central);
    const [bx, by] = meio(c);
    const d = `M${ax} ${ay} L${bx} ${ay} L${bx} ${by}`;
    desenho += `<path d="${d}"/><path class="pulso" style="animation-delay:${i * 0.4}s" d="${d}"/>`;
  });
  trilhas.innerHTML = desenho;

  // Chips: botões com topo e quatro lados (a caixa 3D)
  CHIPS.forEach((c) => {
    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "chip" + (c.central ? " central" : "");
    botao.style.left = (c.x / 520) * 100 + "%";
    botao.style.top = (c.y / 360) * 100 + "%";
    botao.style.width = (c.w / 520) * 100 + "%";
    botao.style.height = (c.h / 360) * 100 + "%";
    botao.setAttribute("aria-pressed", c.central ? "true" : "false");
    botao.setAttribute("aria-label", c.titulo);
    botao.innerHTML = `
      <span class="face lado-t"></span><span class="face lado-e"></span>
      <span class="face lado-d"></span><span class="face lado-f"></span>
      <span class="face topo-chip">${c.id}<span class="led"></span></span>`;
    botao.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", "false"));
      botao.setAttribute("aria-pressed", "true");
      painel.innerHTML = `<h2>${c.titulo}</h2><p>${c.texto}</p>`;
    });
    placa.appendChild(botao);
  });

  // Girar: arrastar com o mouse ou o dedo, ou as setas do teclado
  const INICIO = { rx: 58, rz: -32 };
  let rx = INICIO.rx;
  let rz = INICIO.rz;
  const aplicar = () => {
    rx = Math.max(10, Math.min(80, rx));
    placa.style.setProperty("--rx", rx + "deg");
    placa.style.setProperty("--rz", rz + "deg");
  };

  let arrasto = null;
  palco.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".chip")) return; // clique no chip abre o painel
    arrasto = { x: ev.clientX, y: ev.clientY, rx, rz };
    palco.classList.add("arrastando");
    palco.setPointerCapture(ev.pointerId);
    pararGiro();
  });
  palco.addEventListener("pointermove", (ev) => {
    if (!arrasto) return;
    rz = arrasto.rz + (ev.clientX - arrasto.x) * 0.4;
    rx = arrasto.rx - (ev.clientY - arrasto.y) * 0.3;
    aplicar();
  });
  const soltar = () => {
    arrasto = null;
    palco.classList.remove("arrastando");
  };
  palco.addEventListener("pointerup", soltar);
  palco.addEventListener("pointercancel", soltar);

  document.addEventListener("keydown", (ev) => {
    const passo = { ArrowLeft: [0, -8], ArrowRight: [0, 8], ArrowUp: [-6, 0], ArrowDown: [6, 0] }[ev.key];
    if (!passo) return;
    ev.preventDefault();
    pararGiro();
    rx += passo[0];
    rz += passo[1];
    aplicar();
  });

  // Girar sozinha (desligado se o sistema pede menos movimento)
  const menosMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const botaoGirar = document.getElementById("girar");
  let giro = null;
  function pararGiro() {
    if (giro) clearInterval(giro);
    giro = null;
    botaoGirar.textContent = "Girar sozinha";
  }
  botaoGirar.addEventListener("click", () => {
    if (giro) {
      pararGiro();
      return;
    }
    giro = setInterval(() => {
      rz += 0.6;
      aplicar();
    }, 30);
    botaoGirar.textContent = "Parar";
  });
  document.getElementById("voltar").addEventListener("click", () => {
    pararGiro();
    rx = INICIO.rx;
    rz = INICIO.rz;
    aplicar();
  });

  aplicar();
  if (!menosMovimento) botaoGirar.click();
</script>
</body>
</html>
